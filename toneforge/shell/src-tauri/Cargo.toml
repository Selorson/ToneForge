[package]
name = "toneforge-studio"
version = "0.1.4"
description = "ToneForge Studio — 120 FPS WebGPU Mastering & Stem Workstation (Tauri v2 Desktop Shell)"
edition = "2024"

[[bin]]
name = "ToneForge_Studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ai-uvr5-stem-engine.workspace = true
daw-core-graph.workspace = true
daw-plugin-host.workspace = true
dsp-pitch-time.workspace = true
dsp-proq4-eq.workspace = true
dsp-soothe3-spectral.workspace = true
daw-tauri-host = { path = "../../crates/daw-tauri-host" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13", default-features = false }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
zip.workspace = true

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
