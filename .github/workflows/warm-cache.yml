name: Warm Rust Cache

# Nạp sẵn cache dependency Rust của workspace toneforge trên nhánh main để khi đẩy tag v*
# chỉ cần biên dịch lại các crate nội bộ (~3–5 phút thay vì ~20 phút),
# tiết kiệm tối đa hạn mức 2.000 phút/tháng của tài khoản Selorson.
on:
  push:
    branches:
      - main
    paths:
      - "toneforge/Cargo.lock"
      - "toneforge/Cargo.toml"
      - "toneforge/shell/src-tauri/Cargo.toml"
      - ".github/workflows/warm-cache.yml"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "0 1 * * 1" # Thứ Hai 08:00 giờ VN — chạm cache giữ khỏi hết hạn 7 ngày
  workflow_dispatch: {}

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm-cache:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: toneforge/ui-svelte5-wgpu/package-lock.json

      # PHẢI trùng phiên bản ghim trong release.yml
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Rust Cache
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "toneforge"
          shared-key: "toneforge-release"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JS dependencies
        if: steps.rust_cache.outputs.cache-hit != 'true'
        working-directory: toneforge/ui-svelte5-wgpu
        run: npm ci

      - name: Warm Rust build cache
        if: steps.rust_cache.outputs.cache-hit != 'true'
        working-directory: toneforge/shell
        run: node ../ui-svelte5-wgpu/node_modules/@tauri-apps/cli/tauri.js build --no-bundle
